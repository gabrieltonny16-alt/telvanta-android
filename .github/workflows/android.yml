name: BingwaPulse and Connect Pulse Android builds
on:
  push:
    branches: [ "main", "feature/vecta-branding" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android platform
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Build both Android apps
        run: gradle --no-daemon :app:assembleDebug :connectpulse:assembleDebug
      - name: Name APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk BingwaPulse-debug.apk
          cp connectpulse/build/outputs/apk/debug/connectpulse-debug.apk Connect-Pulse-debug.apk
      - name: Verify APK signatures and package metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs BingwaPulse-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging BingwaPulse-debug.apk | head -n 8
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Connect-Pulse-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Connect-Pulse-debug.apk | head -n 8
      - name: Upload BingwaPulse APK
        uses: actions/upload-artifact@v4
        with:
          name: bingwapulse-android-debug
          path: BingwaPulse-debug.apk
          if-no-files-found: error
      - name: Upload Connect Pulse APK
        uses: actions/upload-artifact@v4
        with:
          name: connect-pulse-android-debug
          path: Connect-Pulse-debug.apk
          if-no-files-found: error
      - name: Publish direct APK download links
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/vecta-branding'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view bingwapulse-latest >/dev/null 2>&1; then
            gh release upload bingwapulse-latest BingwaPulse-debug.apk Connect-Pulse-debug.apk --clobber
          else
            gh release create bingwapulse-latest BingwaPulse-debug.apk Connect-Pulse-debug.apk \\
              --target "$GITHUB_SHA" \\
              --title "BingwaPulse and Connect Pulse - Latest Debug APKs" \\
              --notes "Latest verified debug APKs from the feature/vecta-branding branch. These are test builds, not Play Store releases." \\
              --prerelease
          fi
